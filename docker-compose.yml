services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: ${DB_USER:-curriculo_app_user}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-dev_secret_password_local}
      POSTGRES_DB: ${DB_NAME:-sistema_curriculo_dev}
    volumes:
      - sistema_curriculo_pgdata:/var/lib/postgresql/data
    healthcheck:
      test:
        [
          "CMD-SHELL",
          'pg_isready -U "$$POSTGRES_USER" -d "$$POSTGRES_DB"',
        ]
      interval: 5s
      timeout: 5s
      retries: 20
    restart: unless-stopped

  migrate:
    build:
      context: .
      dockerfile: Dockerfile.backend
    environment:
      DATABASE_URL: postgresql+psycopg://${DB_USER:-curriculo_app_user}:${DB_PASSWORD:-dev_secret_password_local}@db:5432/${DB_NAME:-sistema_curriculo_dev}
    command: ["python", "-m", "alembic", "upgrade", "head"]
    depends_on:
      db:
        condition: service_healthy

  backend:
    build:
      context: .
      dockerfile: Dockerfile.backend
    environment:
      DATABASE_URL: postgresql+psycopg://${DB_USER:-curriculo_app_user}:${DB_PASSWORD:-dev_secret_password_local}@db:5432/${DB_NAME:-sistema_curriculo_dev}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      LOG_ACTOR_HMAC_KEY: ${LOG_ACTOR_HMAC_KEY:-dev-local-hmac-key-32-bytes-minimum!!}
      SESSION_COOKIE_SECURE: ${SESSION_COOKIE_SECURE:-false}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-http://localhost:5173,http://127.0.0.1:5173}
      GRUPO2_API_URL: ${GRUPO2_API_URL:-}
      GRUPO2_API_TIMEOUT_MS: ${GRUPO2_API_TIMEOUT_MS:-5000}
      GRUPO2_DEFAULT_LIMIT: ${GRUPO2_DEFAULT_LIMIT:-10}
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      GEMINI_MODEL: ${GEMINI_MODEL:-}
    depends_on:
      migrate:
        condition: service_completed_successfully
    ports:
      - "127.0.0.1:${BACKEND_PORT:-8000}:8000"
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/ready', timeout=5)",
        ]
      interval: 10s
      timeout: 6s
      retries: 10
      start_period: 10s
    restart: unless-stopped

  frontend:
    build:
      context: .
      dockerfile: Dockerfile.frontend
      args:
        VITE_API_URL: ${VITE_API_URL:-http://localhost:8000}
    depends_on:
      backend:
        condition: service_healthy
    ports:
      - "127.0.0.1:${FRONTEND_PORT:-5173}:8080"
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "wget -q -O /dev/null http://127.0.0.1:8080/ || exit 1",
        ]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

volumes:
  sistema_curriculo_pgdata:
