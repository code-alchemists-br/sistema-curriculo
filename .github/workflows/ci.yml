name: Integração contínua

on:
  pull_request:
  push:
    branches:
      - main
      - dev

permissions:
  contents: read

jobs:
  backend-tests:
    name: Testes unitários do backend
    runs-on: ubuntu-latest
    steps:
      - name: Baixar código do repositório
        uses: actions/checkout@v4

      - name: Instalar o Nix
        uses: cachix/install-nix-action@v31

      - name: Executar testes unitários do backend
        run: nix develop .#backend --command python -m unittest discover -s src/backend/tests -t src
